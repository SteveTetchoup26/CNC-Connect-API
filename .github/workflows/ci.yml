name: Laravel CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ════════════════════════════════════════════
  # JOB 1 — LINTING
  # ════════════════════════════════════════════
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

      - name: Run PHP CS Fixer (dry-run)
        run: |
          composer require --dev friendsofphp/php-cs-fixer --no-interaction --ignore-platform-reqs
          vendor/bin/php-cs-fixer fix --dry-run --diff
        continue-on-error: true

      - name: Run PHPStan
        run: |
          composer require --dev phpstan/phpstan --no-interaction --ignore-platform-reqs
          vendor/bin/phpstan analyse app routes --level=3 --no-progress
        continue-on-error: true

  # ════════════════════════════════════════════
  # JOB 2 — CI (tests)
  # ════════════════════════════════════════════
  ci:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs

      - name: Copy .env
        run: cp .env.example .env

      - name: Force SQLite in .env
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i '/^DB_HOST/d' .env
          sed -i '/^DB_PORT/d' .env
          sed -i '/^DB_DATABASE/d' .env
          sed -i '/^DB_USERNAME/d' .env
          sed -i '/^DB_PASSWORD/d' .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env

      - name: Generate key
        run: php artisan key:generate

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run migrations
        run: php artisan migrate --force

      - name: Set directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run tests
        run: php artisan test

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-build
          path: .

  # ════════════════════════════════════════════
  # JOB 3 — SONARQUBE (scan local)
  # ════════════════════════════════════════════
  sonarqube:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SonarQube Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=cnc-connect-api \
            -Dsonar.sources=app,routes,config,database \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.php.version=8.4
        continue-on-error: true

  # ════════════════════════════════════════════
  # JOB 4 — CD (déploiement)
  # ════════════════════════════════════════════
  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cnc-connect-api:latest -f docker/php/Dockerfile .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cnc-connect-api:latest
