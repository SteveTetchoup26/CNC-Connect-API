input {
  # Reçoit les logs depuis Filebeat
  beats {
    port => 5044
  }

  # Reçoit les logs TCP directs depuis Laravel
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse les logs Laravel (format par défaut)
  if [log][file][path] =~ "laravel" {
    grok {
      match => {
        "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{DATA:environment}\.%{LOGLEVEL:level}: %{GREEDYDATA:log_message}"
      }
    }

    # Convertit le timestamp en date
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }

    # Supprime le champ timestamp redondant
    mutate {
      remove_field => ["timestamp"]
    }
  }

  # Tag les erreurs critiques
  if [level] in ["ERROR", "CRITICAL", "EMERGENCY", "ALERT"] {
    mutate {
      add_tag => ["error"]
    }
  }
}

output {
  # Envoie vers Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "laravel-logs-%{+YYYY.MM.dd}"  # un index par jour
  }

  # Debug : affiche dans les logs Logstash
  stdout {
    codec => rubydebug
  }
}
